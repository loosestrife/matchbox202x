<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cool Edit</title>
  <style>
    body {
      margin: 0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      gap: 0.75rem;
      background: #1e1e1e;
      color: #f0f0f0;
      font-family: system-ui, sans-serif;
    }
    textarea {
      flex: 1;
      width: 100%;
      padding: 0.75rem;
      font-family: monospace;
      font-size: 1rem;
      background: #121212;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      resize: none;
    }
    .audio-panel {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.5rem;
      background: #2a2a2a;
      border-radius: 4px;
    }
    audio {
      width: 100%;
    }
  </style>
</head>
<body>

  <textarea id="editor" placeholder="Type or select text here..."></textarea>

  <div class="audio-panel">
    <audio id="audio-player" controls></audio>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const audioPlayer = document.getElementById('audio-player');
    const pendingChannels = new Map();

    // Helper: Generate a hex channel ID for sendAwaitFullResponse matching
    function generateChannelId() {
      return '0x' + Math.floor(Math.random() * 0xFFFFFFFF).toString(16);
    }

    // Helper: Dispatch Intent over platform IPC
    function sendIntent(action, payload, channel = null) {
      const msg = {
        type: "intent",
        action: action,
        sender: window.xid || 0,
        timestamp: Math.floor(Date.now() / 1000),
        channel: channel,
        payload: payload
      };

      if (window.libplatform && window.libplatform.sendIntent) {
        window.libplatform.sendIntent(action, payload, channel);
      } else {
        window.postMessage(msg, "*");
      }
    }

    // --- CONTEXT MENU / LONG TAP SELECTION TO TTS ---

    editor.addEventListener('contextmenu', (e) => {
      const selectedText = editor.value.substring(editor.selectionStart, editor.selectionEnd);
      if (!selectedText.trim()) return;

      e.preventDefault(); // Override standard context menu

      // Generate a synchronous channel tag for data correlation
      const channelId = generateChannelId();

      // Track channel awaiting full response
      pendingChannels.set(channelId, { type: "tts_request" });

      // Send ui.TextToSpeech intent targeted at cool-tts
      sendIntent("ui.TextToSpeech", {
        text: selectedText,
        target_app: "org.unix.cooledit"
      }, channelId);
    });

    // --- HANDLING INBOUND sys.SendData & BUFFER CONVERSION ---

    async function handleIncomingIntent(data) {
      if (!data || data.type !== "intent") return;

      // Handle final-response carrying the audio file payload
      if (data.action === "sys.SendData" && data.disposition === "final-response") {
        const channel = data.channel;
        
        if (pendingChannels.has(channel)) {
          pendingChannels.delete(channel);
          
          const fileName = data.payload.file_name;
          const localFilePath = `~/.cache/cool-edit/${fileName}`;

          // 1. Fetch binary data as ArrayBuffer via libplatform API
          let arrayBuffer;
          if (window.libplatform && window.libplatform.readFileBuffer) {
            arrayBuffer = await window.libplatform.readFileBuffer(localFilePath);
          } else {
            // Fallback for web card container: fetch local transferred path
            const response = await fetch(localFilePath);
            arrayBuffer = await response.arrayBuffer();
          }

          // 2. Convert ArrayBuffer into a Blob and Object URL for <audio>
          const blob = new Blob([arrayBuffer], { type: 'audio/wav' });
          const audioUrl = URL.createObjectURL(blob);

          // 3. Assign to <audio> tag and play
          audioPlayer.src = audioUrl;
          audioPlayer.play();
        }
      }
    }

    window.addEventListener('message', (event) => handleIncomingIntent(event.data));
    if (window.libplatform && window.libplatform.onIntent) {
      window.libplatform.onIntent(handleIncomingIntent);
    }
  </script>
</body>
</html>
