name: Build and Upload Flammenwerfer APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Upload Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew
        working-directory: Flammenwerfer

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        working-directory: Flammenwerfer

      - name: Prepare Named APK
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-latest}"
          APK_SRC=$(find Flammenwerfer/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          cp "$APK_SRC" "Flammenwerfer-${TAG_NAME}.apk"
          echo "NAMED_APK=Flammenwerfer-${TAG_NAME}.apk" >> $GITHUB_ENV

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAMED_APK }}
          path: ${{ env.NAMED_APK }}
          if-no-files-found: error

      - name: Create Release and Upload APK (on Version Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.NAMED_APK }}
          name: Flammenwerfer ${{ github.ref_name }}
          draft: false
          prerelease: false
