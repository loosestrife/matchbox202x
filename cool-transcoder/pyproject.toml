[project]
name = "cool-transcoder"
version = "0.1.0"
description = "FFmpeg Media Transcoder Service for Matchbox XIntent"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "python-xlib>=0.33",
]

[project.scripts]
cool-transcoder = "cool_transcoder:main"

[tool.setuptools]
py-modules = ["cool_transcoder"]
