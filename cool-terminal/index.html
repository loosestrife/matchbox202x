<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cool-Terminal - 80x24 XBlob ReadableStream VT100</title>
  <script src="/matchbox202x.js"></script>
  <style>
    :root {
      --crt-bg: #040b04;
      --crt-bezel: #121712;
      --crt-border: #263826;
      --phosphor-green: #33ff33;
      --phosphor-dim: #198c19;
      --phosphor-glow: rgba(51, 255, 51, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: radial-gradient(circle at center, #0c160c 0%, #030603 100%);
      color: var(--phosphor-green);
      font-family: "Courier New", "Lucida Console", "DejaVu Sans Mono", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .terminal-cabinet {
      background: var(--crt-bezel);
      border: 2px solid var(--crt-border);
      border-radius: 12px;
      padding: 18px;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(102, 255, 102, 0.12);
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--crt-border);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
    }

    .terminal-title {
      font-weight: bold;
      color: var(--phosphor-green);
      text-shadow: 0 0 8px var(--phosphor-glow);
    }

    .terminal-badges {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 0.78rem;
      color: var(--phosphor-dim);
    }

    .badge {
      padding: 2px 8px;
      border: 1px solid var(--crt-border);
      border-radius: 4px;
      background: #071007;
      color: var(--phosphor-green);
    }

    .crt-viewport {
      position: relative;
      background: var(--crt-bg);
      border: 2px solid #1b2e1b;
      border-radius: 6px;
      padding: 10px 12px;
      box-shadow:
        inset 0 0 24px rgba(0, 0, 0, 0.9),
        0 0 14px rgba(51, 255, 51, 0.08);
      overflow: hidden;
      outline: none;
    }

    .crt-viewport::after {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.22) 3px
      );
      pointer-events: none;
    }

    #terminal-screen {
      margin: 0;
      width: 80ch;
      height: calc(24 * 1.25em);
      line-height: 1.25em;
      font-family: "Courier New", "Lucida Console", "DejaVu Sans Mono", monospace;
      font-size: 15px;
      font-weight: 600;
      color: var(--phosphor-green);
      text-shadow: 0 0 6px var(--phosphor-glow);
      white-space: pre;
      overflow: hidden;
      user-select: text;
    }

    .cursor-cell {
      background: var(--phosphor-green);
      color: var(--crt-bg);
      text-shadow: none;
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      to {
        background: transparent;
        color: var(--phosphor-green);
      }
    }

    .controls-bar {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .cmd-input {
      flex: 1;
      background: #050c05;
      border: 1px solid var(--crt-border);
      border-radius: 4px;
      padding: 7px 10px;
      color: var(--phosphor-green);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .cmd-input:focus {
      border-color: var(--phosphor-green);
      box-shadow: 0 0 6px rgba(51, 255, 51, 0.25);
    }

    .btn {
      background: #0b1b0b;
      color: var(--phosphor-green);
      border: 1px solid var(--crt-border);
      border-radius: 4px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      border-color: var(--phosphor-green);
      box-shadow: 0 0 8px rgba(51, 255, 51, 0.3);
    }
  </style>
</head>
<body>
  <div class="terminal-cabinet">
    <div class="terminal-header">
      <div class="terminal-title">COOL-TERMINAL // 80x24 GREEN PHOSPHOR TTY</div>
      <div class="terminal-badges">
        <span class="badge" id="geom-badge">80x24</span>
        <span class="badge" id="tty-badge">TTY: connecting...</span>
        <span class="badge" id="in-blob-badge">IN: bus=- | nat=-</span>
        <span class="badge" id="out-blob-badge">OUT: bus=- | nat=-</span>
        <span class="badge" id="blob-badge">IN: - / OUT: -</span>
      </div>
    </div>

    <div class="crt-viewport" id="crt-viewport" tabindex="0">
      <pre id="terminal-screen" data-cols="80" data-rows="24"></pre>
    </div>

    <div class="controls-bar">
      <input
        type="text"
        id="cmd-input"
        class="cmd-input"
        placeholder="Type command or click 80x24 screen to type directly..."
        autocomplete="off"
      />
      <button class="btn" id="send-btn">SEND</button>
      <button class="btn" id="clear-btn">CLEAR</button>
      <button class="btn" id="reconnect-btn">NEW TTY</button>
      <button class="btn" id="migrate-btn">MIGRATE</button>
    </div>
  </div>

  <script>
    const COLS = 80;
    const ROWS = 24;
    const screenEl = document.getElementById('terminal-screen');
    const viewportEl = document.getElementById('crt-viewport');
    const ttyBadgeEl = document.getElementById('tty-badge');
    const inBlobBadgeEl = document.getElementById('in-blob-badge');
    const outBlobBadgeEl = document.getElementById('out-blob-badge');
    const blobBadgeEl = document.getElementById('blob-badge');
    const cmdInputEl = document.getElementById('cmd-input');

    let grid = [];
    let cursorRow = 0;
    let cursorCol = 0;
    let ttyName = '/dev/pts/0';
    let inBlobId = null;
    let outBlobId = null;
    let termTxId = null;
    let streamAbortCtrl = null;
    let reportSyncTimer = null;

    function getPlainScreenText() {
      if (!Array.isArray(grid) || grid.length === 0) return '';
      return grid.map((row) => row.join('').replace(/\s+$/, '')).join('\n').trim();
    }

    function updateBadges() {
      ttyBadgeEl.textContent = `TTY: ${ttyName || 'connected'}`;
      const localIn = (window.xhtml && inBlobId) ? window.xhtml.getNatInfo('blob', inBlobId) : inBlobId;
      const localOut = (window.xhtml && outBlobId) ? window.xhtml.getNatInfo('blob', outBlobId) : outBlobId;
      if (inBlobBadgeEl) {
        inBlobBadgeEl.textContent = `IN: nat=${inBlobId || '-'} | bus=${localIn || '-'}`;
        inBlobBadgeEl.dataset.nattedBlobId = String(inBlobId || '');
        inBlobBadgeEl.dataset.busBlobId = String(localIn || '');
      }
      if (outBlobBadgeEl) {
        outBlobBadgeEl.textContent = `OUT: nat=${outBlobId || '-'} | bus=${localOut || '-'}`;
        outBlobBadgeEl.dataset.nattedBlobId = String(outBlobId || '');
        outBlobBadgeEl.dataset.busBlobId = String(localOut || '');
      }
      const inLabel = inBlobId
        ? `${inBlobId}->${localIn || inBlobId} (nat=${inBlobId}, bus=${localIn || inBlobId})`
        : '-';
      const outLabel = outBlobId
        ? `${outBlobId}->${localOut || outBlobId} (nat=${outBlobId}, bus=${localOut || outBlobId})`
        : '-';
      blobBadgeEl.textContent = `IN: ${inLabel} / OUT: ${outLabel}`;
      blobBadgeEl.dataset.inNat = String(inBlobId || '');
      blobBadgeEl.dataset.inBus = String(localIn || '');
      blobBadgeEl.dataset.outNat = String(outBlobId || '');
      blobBadgeEl.dataset.outBus = String(localOut || '');
    }

    function syncTerminalStateToBridge(immediate = false) {
      try {
        const screenText = getPlainScreenText();
        const localIn = (window.xhtml && inBlobId) ? window.xhtml.getNatInfo('blob', inBlobId) : inBlobId;
        const localOut = (window.xhtml && outBlobId) ? window.xhtml.getNatInfo('blob', outBlobId) : outBlobId;
        if (window.localStorage) {
          window.localStorage.setItem('coolTerminal.ttyName', String(ttyName || ''));
          window.localStorage.setItem('coolTerminal.inBlobId', String(inBlobId || ''));
          window.localStorage.setItem('coolTerminal.outBlobId', String(outBlobId || ''));
          window.localStorage.setItem('coolTerminal.localInBlobId', String(localIn || ''));
          window.localStorage.setItem('coolTerminal.localOutBlobId', String(localOut || ''));
          window.localStorage.setItem('coolTerminal.screenText', screenText);
        }
      } catch (_) {}

      if (!window.xhtml || !window.xhtml.cardWin || window.xhtml._isHydrating) return;
      const sendReport = () => {
        reportSyncTimer = null;
        const localStorageSnap = {};
        try {
          for (let i = 0; i < window.localStorage.length; i++) {
            const k = window.localStorage.key(i);
            if (k !== null) localStorageSnap[k] = window.localStorage.getItem(k);
          }
        } catch (_) {}
        fetch('/api/card-hydrated', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Card-Window': String(window.xhtml.cardWin),
          },
          body: JSON.stringify({
            cardWin: window.xhtml.cardWin,
            cardApp: window.xhtml.cardApp || 'cool-terminal',
            cardId: window.xhtml.cardId || 'index',
            localStorage: localStorageSnap,
            heldBlobs: Array.from(window.xhtml.heldBlobs || []),
            openChannels: Array.from((window.xhtml.openChannels || new Map()).keys()),
            blobNatTable: Object.fromEntries(window.xhtml.blobNatTable || []),
            channelNatTable: Object.fromEntries(window.xhtml.channelNatTable || []),
            customState: {
              grid,
              cursorRow,
              cursorCol,
              ttyName,
              inBlobId,
              outBlobId,
              termTxId,
            },
          }),
        }).catch(() => {});
      };

      if (immediate) {
        if (reportSyncTimer) clearTimeout(reportSyncTimer);
        sendReport();
      } else if (!reportSyncTimer) {
        reportSyncTimer = setTimeout(sendReport, 120);
      }
    }

    function resetScreenGrid() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(' '));
      cursorRow = 0;
      cursorCol = 0;
      renderGrid();
    }

    function scrollUpOneLine() {
      grid.shift();
      grid.push(Array(COLS).fill(' '));
      cursorRow = ROWS - 1;
    }

    function advanceLine() {
      cursorRow++;
      if (cursorRow >= ROWS) {
        scrollUpOneLine();
      }
    }

    function putChar(ch) {
      if (ch === '\r') {
        cursorCol = 0;
        return;
      }
      if (ch === '\n') {
        cursorCol = 0;
        advanceLine();
        return;
      }
      if (ch === '\b' || ch === '\x7f') {
        if (cursorCol > 0) {
          cursorCol--;
          grid[cursorRow][cursorCol] = ' ';
        }
        return;
      }
      if (ch === '\t') {
        const nextStop = Math.min(COLS - 1, (Math.floor(cursorCol / 8) + 1) * 8);
        while (cursorCol < nextStop) {
          grid[cursorRow][cursorCol++] = ' ';
        }
        return;
      }
      if (ch.charCodeAt(0) < 32) {
        return;
      }
      if (cursorCol >= COLS) {
        cursorCol = 0;
        advanceLine();
      }
      grid[cursorRow][cursorCol] = ch;
      cursorCol++;
    }

    function stripAndApplyAnsi(text) {
      let i = 0;
      while (i < text.length) {
        if (text[i] === '\x1b') {
          if (text[i + 1] === '[') {
            let j = i + 2;
            while (j < text.length && !/[A-Za-z~]/.test(text[j])) j++;
            const seq = text.slice(i + 2, j);
            const cmd = text[j] || '';
            if (cmd === 'J' && (seq === '2' || seq === '3')) {
              resetScreenGrid();
            } else if (cmd === 'H' && (!seq || seq === '1;1')) {
              cursorRow = 0;
              cursorCol = 0;
            } else if (cmd === 'K') {
              for (let c = cursorCol; c < COLS; c++) grid[cursorRow][c] = ' ';
            }
            i = j + 1;
            continue;
          }
          if (text[i + 1] === ']') {
            let j = i + 2;
            while (j < text.length && text[j] !== '\x07' && !(text[j] === '\x1b' && text[j + 1] === '\\')) j++;
            i = text[j] === '\x07' ? j + 1 : j + 2;
            continue;
          }
          i += 2;
          continue;
        }
        putChar(text[i]);
        i++;
      }
      renderGrid();
    }

    function escapeHtml(ch) {
      if (ch === '&') return '&amp;';
      if (ch === '<') return '&lt;';
      if (ch === '>') return '&gt;';
      return ch;
    }

    function renderGrid() {
      const lines = [];
      const activeCol = Math.min(cursorCol, COLS - 1);
      for (let r = 0; r < ROWS; r++) {
        if (r === cursorRow) {
          const before = grid[r].slice(0, activeCol).map(escapeHtml).join('');
          const curChar = escapeHtml(grid[r][activeCol] || ' ');
          const after = grid[r].slice(activeCol + 1).map(escapeHtml).join('');
          lines.push(`${before}<span class="cursor-cell">${curChar}</span>${after}`);
        } else {
          lines.push(grid[r].map(escapeHtml).join(''));
        }
      }
      screenEl.innerHTML = lines.join('\n');
      syncTerminalStateToBridge(false);
    }

    async function sendKeystrokes(str) {
      if (!inBlobId || !str) return;
      try {
        await fetch(`/xblob/${encodeURIComponent(inBlobId)}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: str }),
        });
      } catch (err) {
        stripAndApplyAnsi(`\r\n[stdin write error: ${err.message}]\r\n`);
      }
    }

    async function pipeOutStreamToScreen(targetOutBlobId, signal) {
      const res = await fetch(`/xblob/${encodeURIComponent(targetOutBlobId)}`, {
        headers: { Accept: 'application/octet-stream' },
        signal,
      });
      if (!res.ok || !res.body) {
        throw new Error(`GET /xblob/${targetOutBlobId} returned HTTP ${res.status}`);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value) {
          stripAndApplyAnsi(decoder.decode(value, { stream: true }));
        }
      }
    }

    function extractOutStreamFromMultipart(rawText) {
      let parsedJson = null;
      let attachedBlob = null;
      const headerMatch = rawText.match(/X-Attached-Blob-Id:\s*([^\r\n]+)/i);
      if (headerMatch) {
        attachedBlob = headerMatch[1].trim();
      }
      const jsonMatch = rawText.match(/\{[\s\S]*?"event"\s*:\s*"term\.getOutStreamResponse"[\s\S]*?\}/i);
      if (jsonMatch) {
        try {
          parsedJson = JSON.parse(jsonMatch[0]);
        } catch (_) {}
      }
      return { parsedJson, attachedBlob };
    }

    function toHexBlobId(raw) {
      if (raw === undefined || raw === null || raw === '') return null;
      const str = String(raw).trim();
      const num = (str.startsWith('0x') || str.startsWith('0X'))
        ? parseInt(str, 16)
        : parseInt(str, 10);
      return !isNaN(num) && num > 0 ? `0x${num.toString(16)}` : str;
    }

    function registerTerminalBlobsAndChannels() {
      if (!window.xhtml) return;
      inBlobId = toHexBlobId(inBlobId);
      outBlobId = toHexBlobId(outBlobId);
      if (inBlobId) {
        window.xhtml.heldBlobs.add(String(inBlobId));
        if (!window.xhtml.blobNatTable.has(String(inBlobId))) {
          window.xhtml.blobNatTable.set(String(inBlobId), String(inBlobId));
        }
        window.xhtml.whenRemapped('blob', inBlobId).then(() => {
          updateBadges();
          syncTerminalStateToBridge(true);
        });
      }
      if (outBlobId) {
        window.xhtml.heldBlobs.add(String(outBlobId));
        if (!window.xhtml.blobNatTable.has(String(outBlobId))) {
          window.xhtml.blobNatTable.set(String(outBlobId), String(outBlobId));
        }
        window.xhtml.whenRemapped('blob', outBlobId).then(() => {
          updateBadges();
          syncTerminalStateToBridge(true);
        });
      }
      if (termTxId) {
        window.xhtml.openChannels.set(Number(termTxId), {
          txId: Number(termTxId),
          intent: 'term.GetOutStream',
          app: 'cool-terminal',
        });
      }
    }

    async function startTerminalSession() {
      if (streamAbortCtrl) {
        streamAbortCtrl.abort();
      }
      streamAbortCtrl = new AbortController();
      resetScreenGrid();
      stripAndApplyAnsi('COOL-TERMINAL 80x24 // Allocating ReadableStream pipes...\r\n');

      try {
        if (window.xhtml && typeof window.xhtml.ensureCardSession === 'function') {
          await window.xhtml.ensureCardSession({ cardApp: 'cool-terminal', cardId: 'index' });
        }

        const createRes = await fetch('/xblob', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            xblobType: 'ReadableStream',
            type: 'application/octet-stream',
            name: 'tty-stdin',
          }),
        });
        const createData = await createRes.json();
        inBlobId = createData.blobId || createData.blob;
        termTxId = Math.floor(Math.random() * 100000) + 500;

        const intentRes = await fetch('/intent/term/GetOutStream', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Channel-Control': 'SYN',
            'X-Tx-Id': String(termTxId),
            'X-Attached-Blob-Id': String(inBlobId),
            'Connection': 'keep-alive',
            'Prefer': 'return=minimal',
          },
          body: JSON.stringify({
            intent: 'term.GetOutStream',
            Connection: 'keep-alive',
            Prefer: 'return=minimal',
          }),
        });

        const rawResponse = await intentRes.text();
        const { parsedJson, attachedBlob } = extractOutStreamFromMultipart(rawResponse);
        outBlobId = attachedBlob || parsedJson?.dataBlob || parsedJson?.blobId;
        ttyName = parsedJson?.tty || '/dev/pts/0';

        registerTerminalBlobsAndChannels();
        updateBadges();
        stripAndApplyAnsi(`Connected to ${ttyName} (IN=${inBlobId}, OUT=${outBlobId})\r\n\r\n`);
        syncTerminalStateToBridge(true);

        if (outBlobId) {
          pipeOutStreamToScreen(outBlobId, streamAbortCtrl.signal).catch((err) => {
            if (err.name !== 'AbortError') {
              stripAndApplyAnsi(`\r\n[stream closed: ${err.message}]\r\n`);
            }
          });
        }
      } catch (err) {
        ttyBadgeEl.textContent = 'TTY: error';
        stripAndApplyAnsi(`\r\n[connection failed: ${err.message}]\r\n`);
      }
    }

    if (window.xhtml) {
      window.xhtml.onfreeze = async () => {
        if (streamAbortCtrl) {
          try { streamAbortCtrl.abort(); } catch (_) {}
          streamAbortCtrl = null;
        }
        return {
          grid,
          cursorRow,
          cursorCol,
          ttyName,
          inBlobId,
          outBlobId,
          termTxId,
        };
      };

      window.xhtml.onthaw = async (customState, snapshot) => {
        const state = customState || snapshot?.customState || {};
        if (Array.isArray(state.grid) && state.grid.length === ROWS) {
          grid = state.grid.map((row) => Array.isArray(row) ? row.slice(0, COLS) : Array(COLS).fill(' '));
        } else if (grid.length !== ROWS) {
          resetScreenGrid();
        }
        if (typeof state.cursorRow === 'number') cursorRow = state.cursorRow;
        if (typeof state.cursorCol === 'number') cursorCol = state.cursorCol;
        if (state.ttyName) ttyName = state.ttyName;
        if (state.inBlobId) inBlobId = state.inBlobId;
        if (state.outBlobId) outBlobId = state.outBlobId;
        if (state.termTxId) termTxId = state.termTxId;

        registerTerminalBlobsAndChannels();
        updateBadges();
        renderGrid();
        syncTerminalStateToBridge(true);

        if (outBlobId) {
          if (streamAbortCtrl) {
            try { streamAbortCtrl.abort(); } catch (_) {}
          }
          streamAbortCtrl = new AbortController();
          pipeOutStreamToScreen(outBlobId, streamAbortCtrl.signal).catch((err) => {
            if (err.name !== 'AbortError') {
              stripAndApplyAnsi(`\r\n[stream closed: ${err.message}]\r\n`);
            }
          });
        }
      };
    }

    viewportEl.addEventListener('keydown', (ev) => {
      if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
      if (ev.key === 'Enter') {
        ev.preventDefault();
        sendKeystrokes('\n');
      } else if (ev.key === 'Backspace') {
        ev.preventDefault();
        sendKeystrokes('\x7f');
      } else if (ev.key === 'Tab') {
        ev.preventDefault();
        sendKeystrokes('\t');
      } else if (ev.key.length === 1) {
        ev.preventDefault();
        sendKeystrokes(ev.key);
      }
    });

    function submitCommandInput() {
      const val = cmdInputEl.value;
      cmdInputEl.value = '';
      sendKeystrokes(val + '\n');
      viewportEl.focus();
    }

    cmdInputEl.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        submitCommandInput();
      }
    });

    document.getElementById('send-btn').addEventListener('click', submitCommandInput);
    document.getElementById('clear-btn').addEventListener('click', () => {
      resetScreenGrid();
      viewportEl.focus();
    });
    document.getElementById('reconnect-btn').addEventListener('click', () => {
      startTerminalSession();
      viewportEl.focus();
    });
    document.getElementById('migrate-btn').addEventListener('click', async () => {
      if (window.xhtml && typeof window.xhtml.liveMigrate === 'function') {
        const hostInput = document.getElementById('xhtml-migrate-host-input');
        const hostSelect = document.getElementById('xhtml-migrate-host-select');
        const rawHost = (hostInput?.value || hostSelect?.value || 'user-desktop').trim();
        const target = rawHost.includes(':') ? rawHost : `${rawHost}:cool-xhtml-runtime`;
        await window.xhtml.liveMigrate(target);
      }
    });

    window.addEventListener('xhtml:blob-transferred', () => {
      updateBadges();
      syncTerminalStateToBridge(true);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search || '');
      const isHydrating = Boolean(params.get('hydrateBlob') || params.get('migrateBlob') || params.get('migrate'));
      if (isHydrating) {
        if (grid.length !== ROWS) resetScreenGrid();
        return;
      }
      resetScreenGrid();
      startTerminalSession();
    });
  </script>
</body>
</html>
