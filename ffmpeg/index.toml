[package]
id = "org.ffmpeg.ffmpeg"
version = "7.0.0"
name = "ffmpeg"
description = "Universal media transcode & transform processing engine"
exec = "ffmpeg_daemon.py"

[dependencies]
"nix:ffmpeg" = "7.0"
"nix:python" = "3.11"

[permissions]
filesystem = ["/tmp"]

[intents.receivers.media.TransformStream] 
handler = "settings.html"
exec = "ffmpeg_daemon.py"
accepts_mime = [
  "video/*",
  "audio/*"
]
emits_mime = [
  "video/mp4",
  "audio/m4a",
  "video/webm",
  "audio/ogg"
]

media.transports = ["file", "socket", "shm"]
